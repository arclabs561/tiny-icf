name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v3
      - name: install
        run: uv sync --extra dev
      - name: lint
        run: uv run ruff check .
      - name: format
        run: uv run black --check .
      - name: test
        run: uv run pytest -q
